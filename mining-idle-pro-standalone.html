<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mining Idle Pro - Full Stack Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            background: rgba(0,0,0,0.3);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .auth-section {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        
        .auth-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .online-badge {
            background: #4CAF50;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin-top: 10px;
        }
        
        .offline-badge {
            background: #FF9800;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin-top: 10px;
        }
        
        .tab-navigation {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            overflow-x: auto;
        }
        
        .tab-btn {
            flex: 1;
            min-width: 100px;
            padding: 12px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            white-space: nowrap;
        }
        
        .tab-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .content-area {
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(10px);
            min-height: 400px;
        }
        
        /* Mining Tab */
        .zone-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding: 10px 0;
        }
        
        .zone-btn {
            padding: 10px 15px;
            background: rgba(0,0,0,0.4);
            border: 2px solid;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            min-width: 100px;
            transition: all 0.3s;
            text-align: center;
            font-size: 12px;
        }
        
        .zone-btn.active {
            transform: scale(1.05);
            box-shadow: 0 0 20px currentColor;
        }
        
        .zone-btn.locked {
            opacity: 0.4;
            cursor: not-allowed;
        }
        
        .event-banner {
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            animation: pulse 2s infinite;
        }
        
        .coin-display {
            text-align: center;
            margin: 20px 0;
        }
        
        .coin-amount {
            font-size: 42px;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 0 0 20px #FFD700;
            margin: 10px 0;
        }
        
        .coin-label {
            font-size: 16px;
            opacity: 0.8;
        }
        
        .combo-display {
            text-align: center;
            color: #FF6B6B;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .combo-display.active {
            opacity: 1;
        }
        
        .mine-button {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: none;
            color: white;
            cursor: pointer;
            margin: 20px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            transition: transform 0.1s;
            position: relative;
        }
        
        .mine-button:active {
            transform: scale(0.95);
        }
        
        .mine-icon {
            font-size: 48px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 20px;
        }
        
        .stat-card {
            background: rgba(255,255,255,0.1);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: #FFD700;
        }
        
        .stat-label {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 5px;
        }
        
        /* Upgrades Tab */
        .upgrade-card {
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .upgrade-card:active {
            transform: scale(0.98);
        }
        
        .upgrade-card.affordable {
            border-color: #4CAF50;
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.3);
        }
        
        .upgrade-card.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .upgrade-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .upgrade-name {
            font-size: 16px;
            font-weight: bold;
        }
        
        .upgrade-level {
            background: rgba(255,215,0,0.3);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }
        
        .upgrade-cost {
            color: #FFD700;
            font-size: 14px;
            margin: 5px 0;
        }
        
        .upgrade-effect {
            font-size: 12px;
            opacity: 0.8;
        }
        
        /* Prestige Tab */
        .prestige-info {
            background: linear-gradient(135deg, rgba(255,215,0,0.2), rgba(255,165,0,0.2));
            border: 2px solid #FFD700;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .prestige-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        
        .prestige-points {
            font-size: 32px;
            font-weight: bold;
            color: #FFD700;
            margin: 10px 0;
        }
        
        .prestige-gain {
            font-size: 18px;
            margin: 10px 0;
        }
        
        .prestige-button {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border: none;
            color: black;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s;
        }
        
        .prestige-button:active {
            transform: scale(0.95);
        }
        
        .prestige-button.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .prestige-upgrades {
            display: grid;
            gap: 12px;
        }
        
        .prestige-upgrade-card {
            background: rgba(138, 43, 226, 0.2);
            border: 2px solid rgba(138, 43, 226, 0.4);
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .prestige-upgrade-card.affordable {
            border-color: #FFD700;
            box-shadow: 0 0 15px rgba(255,215,0,0.3);
        }
        
        .prestige-upgrade-card.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* Achievements Tab */
        .achievement-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        
        .achievement-card {
            background: rgba(0,0,0,0.4);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s;
        }
        
        .achievement-card.unlocked {
            border-color: #FFD700;
            box-shadow: 0 0 15px rgba(255,215,0,0.3);
        }
        
        .achievement-card.locked {
            opacity: 0.5;
        }
        
        .achievement-icon {
            font-size: 36px;
            margin-bottom: 8px;
        }
        
        .achievement-name {
            font-weight: bold;
            font-size: 14px;
            margin: 8px 0;
        }
        
        .achievement-desc {
            font-size: 11px;
            opacity: 0.8;
        }
        
        .achievement-reward {
            margin-top: 8px;
            color: #4CAF50;
            font-weight: bold;
            font-size: 12px;
        }
        
        /* Leaderboard Tab */
        .player-rank {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: black;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-weight: bold;
        }
        
        .leaderboard-list {
            margin-top: 15px;
        }
        
        .leaderboard-entry {
            background: rgba(255,255,255,0.1);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .rank {
            font-weight: bold;
            color: #FFD700;
            min-width: 40px;
        }
        
        .username {
            flex: 1;
            margin: 0 10px;
        }
        
        .coins {
            font-weight: bold;
        }
        
        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 20px;
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal-content {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal-content h2 {
            margin-bottom: 20px;
            text-align: center;
        }
        
        .modal-content input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 10px;
            border: 2px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 16px;
        }
        
        .modal-content button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .modal-link {
            text-align: center;
            margin-top: 15px;
            cursor: pointer;
            opacity: 0.8;
            font-size: 14px;
        }
        
        .modal-close {
            background: rgba(255,255,255,0.2) !important;
            margin-top: 10px;
        }
        
        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            color: #FFD700;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 16px;
            z-index: 10001;
            opacity: 0;
            transition: opacity 0.3s;
            max-width: 90%;
            text-align: center;
        }
        
        .toast.show {
            opacity: 1;
        }
        
        /* Particles */
        .particle {
            position: absolute;
            color: #FFD700;
            font-weight: bold;
            font-size: 18px;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            z-index: 1000;
        }
        
        .particle.crit {
            color: #FF6B6B;
            font-size: 24px;
        }
        
        /* Daily Reward Button */
        .daily-button {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 15px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .daily-button.claimed {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* Animations */
        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateY(-100px);
            }
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.8;
            }
        }
        
        /* Mobile Optimizations */
        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }
            
            .header h1 {
                font-size: 24px;
            }
            
            .mine-button {
                width: 160px;
                height: 160px;
                font-size: 18px;
            }
            
            .mine-icon {
                font-size: 40px;
            }
            
            .coin-amount {
                font-size: 36px;
            }
            
            .tab-btn {
                font-size: 12px;
                padding: 10px;
            }
            
            .achievement-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="toast" class="toast"></div>
    
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>⛏️ MINING IDLE PRO</h1>
            <div class="auth-section" id="authSection">
                <!-- Auth buttons will be inserted here -->
            </div>
            <div id="connectionStatus"></div>
        </div>
        
        <!-- Tab Navigation -->
        <div class="tab-navigation">
            <button class="tab-btn active" onclick="switchTab('mine')">⛏️ Mine</button>
            <button class="tab-btn" onclick="switchTab('upgrades')">⚡ Upgrades</button>
            <button class="tab-btn" onclick="switchTab('prestige')">👑 Prestige</button>
            <button class="tab-btn" onclick="switchTab('achievements')">🏆 Achievements</button>
            <button class="tab-btn" id="leaderboardTab" onclick="switchTab('leaderboard')" style="display: none;">🌍 Ranks</button>
        </div>
        
        <!-- Content Area -->
        <div class="content-area" id="contentArea">
            <!-- Content will be dynamically inserted here -->
        </div>
    </div>
    
    <!-- Auth Modal -->
    <div class="modal-overlay" id="authModal">
        <div class="modal-content">
            <h2 id="authModalTitle">Login</h2>
            <form id="authForm">
                <input type="text" id="authUsername" placeholder="Username" style="display: none;">
                <input type="email" id="authEmail" placeholder="Email" required>
                <input type="password" id="authPassword" placeholder="Password" required>
                <button type="submit" id="authSubmitBtn">Login</button>
                <button type="button" class="modal-close" onclick="closeAuthModal()">Cancel</button>
            </form>
            <div class="modal-link" id="authSwitchLink" onclick="switchAuthMode()">
                Need an account? Sign up
            </div>
        </div>
    </div>
    
    <script>
        // ========================================================================
        // CONFIGURATION
        // ========================================================================
        
        const CONFIG = {
            API_URL: 'http://localhost:3001/api', // Change this to your server URL
            OFFLINE_MODE: false, // Set to false when server is available
            AUTO_SAVE_INTERVAL: 30000, // 30 seconds
            GAME_LOOP_INTERVAL: 100 // 100ms
        };
        
        const ZONES = [
            { id: 'surface', name: 'Surface', unlock: 0, baseValue: 1, color: '#8B7355' },
            { id: 'cave', name: 'Cave', unlock: 1000, baseValue: 5, color: '#4A4A4A' },
            { id: 'crystal', name: 'Crystal', unlock: 50000, baseValue: 25, color: '#9333EA' },
            { id: 'magma', name: 'Magma', unlock: 1000000, baseValue: 100, color: '#EF4444' },
            { id: 'void', name: 'Void', unlock: 50000000, baseValue: 500, color: '#1F2937' }
        ];
        
        const UPGRADES = {
            pickaxe: { base: 10, growth: 1.15, effect: 0.5, name: 'Pickaxe', icon: '⛏️' },
            autoMiner: { base: 100, growth: 1.3, effect: 1, name: 'Auto Miner', icon: '🤖' },
            multiplier: { base: 1000, growth: 2.0, effect: 0.25, name: 'Multiplier', icon: '✨' },
            efficiency: { base: 5000, growth: 1.5, effect: 0.1, name: 'Efficiency', icon: '⚙️' }
        };
        
        const PRESTIGE_UPGRADES = [
            { id: 'autoTap', name: 'Auto Clicker', cost: 1, effect: 'Auto-tap 1/sec', icon: '🖱️' },
            { id: 'offlineBonus', name: 'Offline Boost', cost: 2, effect: '+50% offline', icon: '💤' },
            { id: 'prestigeMulti', name: 'Prestige Multi', cost: 5, effect: '+10% earnings', icon: '📈' },
            { id: 'critChance', name: 'Critical Hits', cost: 10, effect: '5% crit 5x', icon: '💥' }
        ];
        
        const ACHIEVEMENTS = [
            { id: 'first_mine', name: 'First Strike', desc: 'Mine first coin', reward: 10, icon: '⭐' },
            { id: 'hundred', name: 'Centurion', desc: 'Reach 100 coins', reward: 50, icon: '💯' },
            { id: 'thousand', name: 'Millionaire', desc: 'Reach 1,000 coins', reward: 100, icon: '💰' },
            { id: 'prestige_1', name: 'Rebirth', desc: 'Prestige once', reward: 200, icon: '🔄' },
            { id: 'zone_2', name: 'Explorer', desc: 'Unlock Cave', reward: 150, icon: '🗺️' },
            { id: 'auto_10', name: 'Automation', desc: 'Auto Miner 10', reward: 300, icon: '🏭' }
        ];
        
        // ========================================================================
        // GAME STATE
        // ========================================================================
        
        const gameState = {
            // Core
            coins: 0,
            prestigePoints: 0,
            gems: 50,
            currentZone: 'surface',
            
            // Upgrades
            upgrades: { pickaxe: 1, autoMiner: 0, multiplier: 0, efficiency: 0 },
            prestigeUpgrades: { autoTap: 0, offlineBonus: 0, prestigeMulti: 0, critChance: 0 },
            
            // Progress
            achievements: [],
            stats: {
                totalClicks: 0,
                totalEarned: 0,
                totalPrestiges: 0,
                playTime: 0
            },
            
            // Temporary
            comboMultiplier: 1,
            lastClickTime: 0,
            activeEvents: [],
            dailyRewardClaimed: false,
            dailyStreak: 0,
            
            // User
            isAuthenticated: false,
            currentUser: null,
            token: null
        };
        
        let currentTab = 'mine';
        let authMode = 'login';
        let gameLoopInterval = null;
        let autoSaveInterval = null;
        
        // ========================================================================
        // UTILITY FUNCTIONS
        // ========================================================================
        
        function formatNumber(num) {
            if (num >= 1e15) return (num / 1e15).toFixed(2) + 'Qa';
            if (num >= 1e12) return (num / 1e12).toFixed(2) + 'T';
            if (num >= 1e9) return (num / 1e9).toFixed(2) + 'B';
            if (num >= 1e6) return (num / 1e6).toFixed(2) + 'M';
            if (num >= 1e3) return (num / 1e3).toFixed(2) + 'K';
            return Math.floor(num).toLocaleString();
        }
        
        function calculatePrestigeGain() {
            return Math.floor(Math.sqrt(gameState.coins / 1000000));
        }
        
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
        
        function createParticle(x, y, value, isCrit = false) {
            const particle = document.createElement('div');
            particle.className = 'particle' + (isCrit ? ' crit' : '');
            particle.textContent = '+' + formatNumber(value);
            particle.style.left = x + 'px';
            particle.style.top = y + 'px';
            document.body.appendChild(particle);
            
            setTimeout(() => {
                particle.remove();
            }, 1000);
        }
        
        // ========================================================================
        // GAME CALCULATIONS
        // ========================================================================
        
        function getCurrentZone() {
            return ZONES.find(z => z.id === gameState.currentZone);
        }
        
        function calculateMiningPower() {
            const zone = getCurrentZone();
            let power = 1 + (gameState.upgrades.pickaxe - 1) * UPGRADES.pickaxe.effect;
            power *= zone.baseValue;
            power *= (1 + gameState.upgrades.multiplier * UPGRADES.multiplier.effect);
            power *= (1 + gameState.prestigeUpgrades.prestigeMulti * 0.1);
            power *= gameState.comboMultiplier;
            
            // Event multipliers
            gameState.activeEvents.forEach(event => {
                power *= event.multiplier;
            });
            
            return Math.floor(power);
        }
        
        function calculateAutoMining() {
            if (gameState.upgrades.autoMiner === 0) return 0;
            const zone = getCurrentZone();
            let rate = gameState.upgrades.autoMiner * UPGRADES.autoMiner.effect;
            rate *= zone.baseValue;
            rate *= (1 + gameState.upgrades.efficiency * UPGRADES.efficiency.effect);
            rate *= (1 + gameState.prestigeUpgrades.prestigeMulti * 0.1);
            return rate;
        }
        
        function getUpgradeCost(type) {
            const upgrade = UPGRADES[type];
            return Math.floor(upgrade.base * Math.pow(upgrade.growth, gameState.upgrades[type]));
        }
        
        // ========================================================================
        // GAME ACTIONS
        // ========================================================================
        
        function mine() {
            let earnings = calculateMiningPower();
            let isCrit = false;
            
            // Critical hit check
            if (gameState.prestigeUpgrades.critChance > 0) {
                const critChance = gameState.prestigeUpgrades.critChance * 0.05;
                if (Math.random() < critChance) {
                    earnings *= 5;
                    isCrit = true;
                    showToast('💥 CRITICAL HIT!');
                }
            }
            
            // Combo system
            const now = Date.now();
            if (now - gameState.lastClickTime < 500) {
                gameState.comboMultiplier = Math.min(gameState.comboMultiplier + 0.1, 3);
            } else {
                gameState.comboMultiplier = 1;
            }
            gameState.lastClickTime = now;
            
            // Add earnings
            gameState.coins += earnings;
            gameState.stats.totalClicks++;
            gameState.stats.totalEarned += earnings;
            
            // Create particle
            const button = document.querySelector('.mine-button');
            if (button) {
                const rect = button.getBoundingClientRect();
                createParticle(
                    rect.left + rect.width / 2,
                    rect.top + rect.height / 2,
                    earnings,
                    isCrit
                );
            }
            
            // Check achievements
            checkAchievements();
            
            // Update UI
            renderCurrentTab();
        }
        
        function buyUpgrade(type) {
            const cost = getUpgradeCost(type);
            
            if (gameState.coins >= cost) {
                gameState.coins -= cost;
                gameState.upgrades[type]++;
                showToast(`${UPGRADES[type].icon} ${UPGRADES[type].name} upgraded to level ${gameState.upgrades[type]}!`);
                renderCurrentTab();
                saveGame();
            }
        }
        
        function prestige() {
            const gain = calculatePrestigeGain();
            
            if (gain > 0) {
                gameState.prestigePoints += gain;
                gameState.coins = 0;
                gameState.upgrades = { pickaxe: 1, autoMiner: 0, multiplier: 0, efficiency: 0 };
                gameState.currentZone = 'surface';
                gameState.stats.totalPrestiges++;
                
                showToast(`👑 Prestiged! +${gain} Prestige Points`);
                checkAchievements();
                renderCurrentTab();
                saveGame();
            }
        }
        
        function buyPrestigeUpgrade(id) {
            const upgrade = PRESTIGE_UPGRADES.find(u => u.id === id);
            
            if (gameState.prestigePoints >= upgrade.cost) {
                gameState.prestigePoints -= upgrade.cost;
                gameState.prestigeUpgrades[id]++;
                showToast(`${upgrade.icon} ${upgrade.name} purchased!`);
                renderCurrentTab();
                saveGame();
            }
        }
        
        function unlockZone(zoneId) {
            const zone = ZONES.find(z => z.id === zoneId);
            
            if (gameState.coins >= zone.unlock) {
                gameState.currentZone = zoneId;
                showToast(`🗺️ Unlocked ${zone.name}!`);
                checkAchievements();
                renderCurrentTab();
            }
        }
        
        function checkAchievements() {
            const newAchievements = [];
            
            ACHIEVEMENTS.forEach(ach => {
                if (gameState.achievements.includes(ach.id)) return;
                
                let unlocked = false;
                switch (ach.id) {
                    case 'first_mine':
                        unlocked = gameState.coins >= 1;
                        break;
                    case 'hundred':
                        unlocked = gameState.coins >= 100;
                        break;
                    case 'thousand':
                        unlocked = gameState.coins >= 1000;
                        break;
                    case 'prestige_1':
                        unlocked = gameState.stats.totalPrestiges >= 1;
                        break;
                    case 'zone_2':
                        unlocked = gameState.currentZone !== 'surface';
                        break;
                    case 'auto_10':
                        unlocked = gameState.upgrades.autoMiner >= 10;
                        break;
                }
                
                if (unlocked) {
                    gameState.achievements.push(ach.id);
                    gameState.gems += ach.reward;
                    newAchievements.push(ach);
                }
            });
            
            newAchievements.forEach(ach => {
                showToast(`🏆 Achievement: ${ach.name} (+${ach.reward} gems)`);
            });
        }
        
        // ========================================================================
        // GAME LOOP
        // ========================================================================
        
        function gameLoop() {
            // Auto mining
            const autoEarnings = calculateAutoMining() / 10;
            if (autoEarnings > 0) {
                gameState.coins += autoEarnings;
            }
            
            // Auto tap from prestige upgrade
            if (gameState.prestigeUpgrades.autoTap > 0) {
                const autoTapEarnings = calculateMiningPower() * gameState.prestigeUpgrades.autoTap / 10;
                gameState.coins += autoTapEarnings;
            }
            
            // Combo decay
            if (gameState.comboMultiplier > 1 && Date.now() - gameState.lastClickTime > 1000) {
                gameState.comboMultiplier = Math.max(1, gameState.comboMultiplier - 0.05);
            }
            
            // Update combo display
            const comboDisplay = document.querySelector('.combo-display');
            if (comboDisplay) {
                if (gameState.comboMultiplier > 1) {
                    comboDisplay.textContent = `🔥 ${gameState.comboMultiplier.toFixed(1)}x COMBO!`;
                    comboDisplay.classList.add('active');
                } else {
                    comboDisplay.classList.remove('active');
                }
            }
            
            // Update coin display if on mine tab
            if (currentTab === 'mine') {
                const coinAmount = document.querySelector('.coin-amount');
                if (coinAmount) {
                    coinAmount.textContent = formatNumber(gameState.coins);
                }
                
                const autoMiningText = document.querySelector('#autoMiningRate');
                if (autoMiningText) {
                    autoMiningText.textContent = formatNumber(calculateAutoMining());
                }
            }
        }
        
        // ========================================================================
        // SAVE/LOAD SYSTEM
        // ========================================================================
        
        function saveGame() {
            const saveData = {
                ...gameState,
                timestamp: Date.now()
            };
            
            localStorage.setItem('miningIdleProSave', JSON.stringify(saveData));
            
            // Cloud save if authenticated
            if (gameState.isAuthenticated && !CONFIG.OFFLINE_MODE) {
                cloudSaveGame(saveData);
            }
        }
        
        function loadGame() {
            try {
                const saved = localStorage.getItem('miningIdleProSave');
                if (saved) {
                    const data = JSON.parse(saved);
                    
                    // Restore state
                    Object.assign(gameState, {
                        coins: data.coins || 0,
                        prestigePoints: data.prestigePoints || 0,
                        gems: data.gems || 50,
                        currentZone: data.currentZone || 'surface',
                        upgrades: data.upgrades || { pickaxe: 1, autoMiner: 0, multiplier: 0, efficiency: 0 },
                        prestigeUpgrades: data.prestigeUpgrades || { autoTap: 0, offlineBonus: 0, prestigeMulti: 0, critChance: 0 },
                        achievements: data.achievements || [],
                        stats: data.stats || { totalClicks: 0, totalEarned: 0, totalPrestiges: 0, playTime: 0 }
                    });
                    
                    // Calculate offline earnings
                    if (data.timestamp) {
                        const offlineTime = Math.min(Date.now() - data.timestamp, 8 * 60 * 60 * 1000);
                        const offlineRate = calculateAutoMining();
                        const offlineEarnings = Math.floor((offlineRate * offlineTime) / 1000);
                        
                        if (offlineEarnings > 0) {
                            gameState.coins += offlineEarnings;
                            showToast(`💤 Welcome back! +${formatNumber(offlineEarnings)} offline earnings`);
                        }
                    }
                    
                    return true;
                }
            } catch (e) {
                console.error('Load error:', e);
            }
            return false;
        }
        
        // ========================================================================
        // CLOUD SAVE/LOAD (Optional - requires backend)
        // ========================================================================
        
        async function cloudSaveGame(saveData) {
            try {
                const response = await fetch(`${CONFIG.API_URL}/save`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${gameState.token}`
                    },
                    body: JSON.stringify(saveData)
                });
                
                if (response.ok) {
                    console.log('Cloud save successful');
                }
            } catch (error) {
                console.error('Cloud save error:', error);
            }
        }
        
        async function cloudLoadGame() {
            try {
                const response = await fetch(`${CONFIG.API_URL}/save`, {
                    headers: {
                        'Authorization': `Bearer ${gameState.token}`
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    Object.assign(gameState, data);
                    showToast('☁️ Game loaded from cloud!');
                    renderCurrentTab();
                }
            } catch (error) {
                console.error('Cloud load error:', error);
            }
        }
        
        // ========================================================================
        // AUTHENTICATION (Optional - requires backend)
        // ========================================================================
        
        function openAuthModal(mode) {
            authMode = mode;
            const modal = document.getElementById('authModal');
            const title = document.getElementById('authModalTitle');
            const username = document.getElementById('authUsername');
            const submitBtn = document.getElementById('authSubmitBtn');
            const switchLink = document.getElementById('authSwitchLink');
            
            if (mode === 'register') {
                title.textContent = 'Sign Up';
                username.style.display = 'block';
                submitBtn.textContent = 'Sign Up';
                switchLink.textContent = 'Have an account? Login';
            } else {
                title.textContent = 'Login';
                username.style.display = 'none';
                submitBtn.textContent = 'Login';
                switchLink.textContent = 'Need an account? Sign up';
            }
            
            modal.classList.add('active');
        }
        
        function closeAuthModal() {
            document.getElementById('authModal').classList.remove('active');
        }
        
        function switchAuthMode() {
            openAuthModal(authMode === 'login' ? 'register' : 'login');
        }
        
        async function handleAuth(e) {
            e.preventDefault();
            
            if (CONFIG.OFFLINE_MODE) {
                showToast('⚠️ Server not available - playing offline');
                closeAuthModal();
                return;
            }
            
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            const username = document.getElementById('authUsername').value;
            
            try {
                const endpoint = authMode === 'register' ? '/auth/register' : '/auth/login';
                const body = authMode === 'register' 
                    ? { username, email, password }
                    : { email, password };
                
                const response = await fetch(`${CONFIG.API_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    gameState.isAuthenticated = true;
                    gameState.currentUser = data.user;
                    gameState.token = data.token;
                    localStorage.setItem('authToken', data.token);
                    
                    showToast(`✅ ${authMode === 'register' ? 'Account created' : 'Welcome back'}!`);
                    closeAuthModal();
                    updateAuthUI();
                    
                    // Load from cloud
                    await cloudLoadGame();
                } else {
                    showToast(`❌ ${data.error}`);
                }
            } catch (error) {
                showToast('❌ Connection error - playing offline');
                closeAuthModal();
            }
        }
        
        function logout() {
            gameState.isAuthenticated = false;
            gameState.currentUser = null;
            gameState.token = null;
            localStorage.removeItem('authToken');
            showToast('👋 Logged out');
            updateAuthUI();
        }
        
        function updateAuthUI() {
            const authSection = document.getElementById('authSection');
            const leaderboardTab = document.getElementById('leaderboardTab');
            const statusDiv = document.getElementById('connectionStatus');
            
            if (gameState.isAuthenticated) {
                authSection.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center;">
                        <span>👤 ${gameState.currentUser.username}</span>
                        <button class="auth-btn" onclick="logout()">🚪 Logout</button>
                    </div>
                `;
                leaderboardTab.style.display = 'block';
                statusDiv.innerHTML = '<div class="online-badge">☁️ Online</div>';
            } else {
                authSection.innerHTML = `
                    <button class="auth-btn" onclick="openAuthModal('login')">🔐 Login</button>
                    <button class="auth-btn" onclick="openAuthModal('register')">➕ Sign Up</button>
                `;
                leaderboardTab.style.display = 'none';
                statusDiv.innerHTML = CONFIG.OFFLINE_MODE 
                    ? '<div class="offline-badge">📱 Offline Mode</div>'
                    : '<div class="online-badge">☁️ Ready</div>';
            }
        }
        
        // ========================================================================
        // UI RENDERING
        // ========================================================================
        
        function switchTab(tab) {
            currentTab = tab;
            
            // Update tab buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            renderCurrentTab();
        }
        
        function renderCurrentTab() {
            const content = document.getElementById('contentArea');
            
            switch (currentTab) {
                case 'mine':
                    content.innerHTML = renderMineTab();
                    break;
                case 'upgrades':
                    content.innerHTML = renderUpgradesTab();
                    break;
                case 'prestige':
                    content.innerHTML = renderPrestigeTab();
                    break;
                case 'achievements':
                    content.innerHTML = renderAchievementsTab();
                    break;
                case 'leaderboard':
                    content.innerHTML = renderLeaderboardTab();
                    break;
            }
        }
        
        function renderMineTab() {
            const zone = getCurrentZone();
            const miningPower = calculateMiningPower();
            const autoRate = calculateAutoMining();
            
            let eventHTML = '';
            if (gameState.activeEvents.length > 0) {
                eventHTML = gameState.activeEvents.map(e => 
                    `<div class="event-banner">🎉 ${e.name} - ${e.multiplier}x Earnings!</div>`
                ).join('');
            }
            
            return `
                ${eventHTML}
                
                <div class="zone-selector">
                    ${ZONES.map(z => `
                        <button 
                            class="zone-btn ${z.id === gameState.currentZone ? 'active' : ''} ${gameState.coins < z.unlock ? 'locked' : ''}"
                            style="border-color: ${z.color}"
                            onclick="unlockZone('${z.id}')"
                            ${gameState.coins < z.unlock ? 'disabled' : ''}
                        >
                            ${gameState.coins < z.unlock ? '🔒' : ''} ${z.name}<br>
                            <small>${z.baseValue}x</small>
                        </button>
                    `).join('')}
                </div>
                
                <div class="combo-display"></div>
                
                <div class="coin-display">
                    <div style="font-size: 32px; margin-bottom: 10px;">💰</div>
                    <div class="coin-amount">${formatNumber(gameState.coins)}</div>
                    <div class="coin-label">COINS</div>
                </div>
                
                <button class="mine-button" onclick="mine()" style="background: ${zone.color}">
                    <div class="mine-icon">⛏️</div>
                    <div>MINE</div>
                    <small>+${formatNumber(miningPower)}</small>
                </button>
                
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value">${formatNumber(miningPower)}</div>
                        <div class="stat-label">Per Tap</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="autoMiningRate">${formatNumber(autoRate)}</div>
                        <div class="stat-label">Per Second</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${gameState.prestigePoints}</div>
                        <div class="stat-label">Prestige</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${gameState.achievements.length}/${ACHIEVEMENTS.length}</div>
                        <div class="stat-label">Achievements</div>
                    </div>
                </div>
            `;
        }
        
        function renderUpgradesTab() {
            return `
                <h2 style="margin-bottom: 20px; text-align: center;">⚡ Upgrades</h2>
                
                ${Object.entries(UPGRADES).map(([key, upgrade]) => {
                    const level = gameState.upgrades[key];
                    const cost = getUpgradeCost(key);
                    const canAfford = gameState.coins >= cost;
                    
                    return `
                        <div 
                            class="upgrade-card ${canAfford ? 'affordable' : 'locked'}"
                            onclick="${canAfford ? `buyUpgrade('${key}')` : ''}"
                        >
                            <div class="upgrade-header">
                                <div class="upgrade-name">${upgrade.icon} ${upgrade.name}</div>
                                <div class="upgrade-level">Lvl ${level}</div>
                            </div>
                            <div class="upgrade-cost">💰 ${formatNumber(cost)}</div>
                            <div class="upgrade-effect">
                                ${key === 'pickaxe' ? `+${upgrade.effect} mining power` : ''}
                                ${key === 'autoMiner' ? `+${upgrade.effect}/sec auto mining` : ''}
                                ${key === 'multiplier' ? `+${(upgrade.effect * 100).toFixed(0)}% multiplier` : ''}
                                ${key === 'efficiency' ? `+${(upgrade.effect * 100).toFixed(0)}% efficiency` : ''}
                            </div>
                        </div>
                    `;
                }).join('')}
            `;
        }
        
        function renderPrestigeTab() {
            const prestigeGain = calculatePrestigeGain();
            
            return `
                <h2 style="margin-bottom: 20px; text-align: center;">👑 Prestige System</h2>
                
                <div class="prestige-info">
                    <div class="prestige-icon">👑</div>
                    <div style="font-size: 18px;">Prestige Points</div>
                    <div class="prestige-points">${gameState.prestigePoints}</div>
                    <div class="prestige-gain">
                        Gain on reset: <strong>${prestigeGain}</strong>
                    </div>
                    <p style="margin-top: 15px; font-size: 14px; opacity: 0.9;">
                        Reset all progress for permanent upgrades!
                    </p>
                    <button 
                        class="prestige-button ${prestigeGain === 0 ? 'locked' : ''}"
                        onclick="${prestigeGain > 0 ? 'prestige()' : ''}"
                        ${prestigeGain === 0 ? 'disabled' : ''}
                    >
                        🔄 PRESTIGE NOW
                    </button>
                </div>
                
                <div class="prestige-upgrades">
                    ${PRESTIGE_UPGRADES.map(upgrade => {
                        const owned = gameState.prestigeUpgrades[upgrade.id];
                        const canAfford = gameState.prestigePoints >= upgrade.cost;
                        
                        return `
                            <div 
                                class="prestige-upgrade-card ${canAfford ? 'affordable' : 'locked'}"
                                onclick="${canAfford ? `buyPrestigeUpgrade('${upgrade.id}')` : ''}"
                            >
                                <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                                    <div style="font-weight: bold;">${upgrade.icon} ${upgrade.name}</div>
                                    <div style="background: rgba(255,215,0,0.3); padding: 4px 12px; border-radius: 20px; font-size: 12px;">
                                        Lvl ${owned}
                                    </div>
                                </div>
                                <div style="font-size: 12px; opacity: 0.8; margin-bottom: 8px;">${upgrade.effect}</div>
                                <div style="color: #FFD700; font-weight: bold;">💎 ${upgrade.cost} PP</div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }
        
        function renderAchievementsTab() {
            return `
                <h2 style="margin-bottom: 20px; text-align: center;">🏆 Achievements</h2>
                <p style="text-align: center; margin-bottom: 20px; opacity: 0.8;">
                    ${gameState.achievements.length} / ${ACHIEVEMENTS.length} Unlocked
                </p>
                
                <div class="achievement-grid">
                    ${ACHIEVEMENTS.map(ach => {
                        const unlocked = gameState.achievements.includes(ach.id);
                        
                        return `
                            <div class="achievement-card ${unlocked ? 'unlocked' : 'locked'}">
                                <div class="achievement-icon">${unlocked ? ach.icon : '🔒'}</div>
                                <div class="achievement-name">${ach.name}</div>
                                <div class="achievement-desc">${ach.desc}</div>
                                ${unlocked ? `<div class="achievement-reward">+${ach.reward} 💎</div>` : ''}
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }
        
        function renderLeaderboardTab() {
            return `
                <h2 style="margin-bottom: 20px; text-align: center;">🌍 Global Leaderboard</h2>
                
                <p style="text-align: center; padding: 40px 20px; opacity: 0.7;">
                    ${gameState.isAuthenticated 
                        ? 'Leaderboard loading...<br><br>Connect to server to view global rankings!' 
                        : 'Login to view global leaderboard!'}
                </p>
            `;
        }
        
        // ========================================================================
        // INITIALIZATION
        // ========================================================================
        
        function initGame() {
            console.log('🎮 Mining Idle Pro - Initializing...');
            
            // Load saved game
            loadGame();
            
            // Check for auth token
            const savedToken = localStorage.getItem('authToken');
            if (savedToken && !CONFIG.OFFLINE_MODE) {
                gameState.token = savedToken;
                gameState.isAuthenticated = true;
                // Try to load user info from server
                cloudLoadGame().catch(() => {
                    console.log('Could not load from cloud, using local save');
                });
            }
            
            // Update UI
            updateAuthUI();
            renderCurrentTab();
            
            // Setup form handler
            document.getElementById('authForm').addEventListener('submit', handleAuth);
            
            // Start game loop
            gameLoopInterval = setInterval(gameLoop, CONFIG.GAME_LOOP_INTERVAL);
            
            // Start auto-save
            autoSaveInterval = setInterval(saveGame, CONFIG.AUTO_SAVE_INTERVAL);
            
            // Save on page unload
            window.addEventListener('beforeunload', saveGame);
            
            // Handle visibility change for offline earnings
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) {
                    loadGame();
                    renderCurrentTab();
                }
            });
            
            console.log('✅ Game ready!');
            showToast('⛏️ Welcome to Mining Idle Pro!');
        }
        
        // Start game when page loads
        window.addEventListener('load', initGame);
    </script>
</body>
</html>
